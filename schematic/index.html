<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INDRBT · Schematic and board layers</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#101d28;color:#e1ebf2;font:13px/1.5 "Segoe UI",Arial,sans-serif}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 17px;border-bottom:1px solid #2d4352;background:#122330}label{font-size:11px;color:#a0bac9}select,button,a{font:inherit}select,button{border:1px solid #3a5869;background:#192f3e;color:#dcecf5;border-radius:4px;padding:7px 10px;min-height:35px}button{cursor:pointer;min-width:35px}select{max-width:220px}a{color:#83d6d2;text-decoration:none;font-size:11px;margin-left:auto}.tools{display:flex;gap:5px;align-items:center}.zoom{font-size:10px;color:#a1bacb;min-width:38px;text-align:center}#stage{position:relative;flex:1;min-height:100px;overflow:hidden;background:#dfe6e9;touch-action:none;cursor:grab;outline-offset:-3px}#stage:active{cursor:grabbing}#drawing{position:absolute;top:0;left:0;max-width:none;transform-origin:0 0;background:white;box-shadow:0 4px 25px #142c3b30;user-select:none}footer{display:flex;justify-content:space-between;gap:10px;padding:8px 16px;color:#8eacbc;font-size:10px;border-top:1px solid #2a4050}footer a{font-size:10px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #83d6d2;outline-offset:2px}@media(max-width:560px){.toolbar{padding:9px;gap:6px}label{display:none}select{max-width:170px;font-size:11px}.toolbar>a{font-size:10px}.tools{gap:4px}button{padding:6px 8px}footer{font-size:9px;padding:7px 10px}footer span{max-width:230px}}
</style></head><body><div class="toolbar"><label for="sheet">Drawing</label><select id="sheet"><option value="schematic">Complete schematic</option><option value="top">Top copper</option><option value="ground">Ground plane</option><option value="power">3.3 V power plane</option><option value="bottom">Bottom copper</option><option value="assembly">Assembly drawing</option></select><div class="tools"><button id="out" aria-label="Zoom out">−</button><span class="zoom" id="zoom">100%</span><button id="in" aria-label="Zoom in">+</button><button id="fit">Fit</button></div><a id="pdf" href="files/schematic.pdf" target="_blank" rel="noopener">Open PDF ↗</a></div><div id="stage" tabindex="0" aria-label="Zoomable drawing. Drag to pan, scroll or use plus and minus to zoom. Press Home to fit."><img id="drawing" src="files/schematic.svg" alt="Native INDRBT KiCad schematic" draggable="false"></div><footer><span>Actual KiCad export · drag to pan · scroll to zoom</span><a href="../docs/electronics_tour.html">Circuit explanation ↗</a></footer><script>
'use strict';const stage=document.getElementById('stage'),image=document.getElementById('drawing'),meter=document.getElementById('zoom');let scale=1,x=0,y=0,drag=null;const sheets={schematic:{file:'schematic.svg',name:'Complete native KiCad schematic',pdf:'schematic.pdf'},top:{file:'top.svg',name:'Top copper layer',pdf:'layers.pdf'},ground:{file:'ground.svg',name:'Ground plane',pdf:'layers.pdf'},power:{file:'power.svg',name:'3.3 V power plane',pdf:'layers.pdf'},bottom:{file:'bottom.svg',name:'Bottom copper layer',pdf:'layers.pdf'},assembly:{file:'assembly.svg',name:'PCB assembly drawing',pdf:'layers.pdf'}};
function render(){image.style.transform=`translate(${x}px,${y}px) scale(${scale})`;meter.textContent=Math.round(scale*100)+'%'}function fit(){if(!image.naturalWidth)return;scale=Math.min((stage.clientWidth-32)/image.naturalWidth,(stage.clientHeight-32)/image.naturalHeight);x=(stage.clientWidth-image.naturalWidth*scale)/2;y=(stage.clientHeight-image.naturalHeight*scale)/2;render()}function zoom(f,mx=stage.clientWidth/2,my=stage.clientHeight/2){const next=Math.min(25,Math.max(.03,scale*f));x=mx-(mx-x)*next/scale;y=my-(my-y)*next/scale;scale=next;render()}
image.addEventListener('load',fit);if(image.complete)fit();document.getElementById('in').onclick=()=>zoom(1.35);document.getElementById('out').onclick=()=>zoom(1/1.35);document.getElementById('fit').onclick=fit;document.getElementById('sheet').onchange=e=>{const s=sheets[e.target.value];image.src='files/'+s.file;image.alt=s.name;document.getElementById('pdf').href='files/'+s.pdf};stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0018),e.clientX-r.left,e.clientY-r.top)},{passive:false});stage.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx:x,ty:y};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag){x=drag.tx+e.clientX-drag.x;y=drag.ty+e.clientY-drag.y;render()}});for(const event of ['pointerup','pointercancel'])stage.addEventListener(event,()=>drag=null);stage.addEventListener('keydown',e=>{if(['+','=','-','Home','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='+'||e.key==='=')zoom(1.3);else if(e.key==='-')zoom(1/1.3);else if(e.key==='Home')fit();else if(e.key==='ArrowUp'){y+=30;render()}else if(e.key==='ArrowDown'){y-=30;render()}else if(e.key==='ArrowLeft'){x+=30;render()}else if(e.key==='ArrowRight'){x-=30;render()}});new ResizeObserver(fit).observe(stage);
</script></body></html>
