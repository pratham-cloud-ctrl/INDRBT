<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTER-6 · 3D circuit board</title><script type="module" src="viewer/model-viewer.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0e1c28;color:#deebf2;font:13px/1.5 "Segoe UI",Arial,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 15px;background:#132632;border-bottom:1px solid #2b4353}.controls span{font-size:11px;color:#99b6c6;margin-right:auto}button{cursor:pointer;background:#1b3544;color:#d7eaf4;border:1px solid #3c5e70;border-radius:5px;font:inherit;font-size:11px;min-height:34px;padding:7px 11px}button:hover{background:#284757}button:focus-visible,a:focus-visible{outline:2px solid #79d8d0;outline-offset:3px}model-viewer{width:100%;flex:1;min-height:200px;background:radial-gradient(ellipse at 45% 40%,#213d49,#0d1b28 75%);--poster-color:transparent}.note{padding:10px 15px;font-size:10px;color:#86a3b7;border-top:1px solid #273d4c;display:flex;gap:15px;justify-content:space-between}.note a{color:#83d4ce;text-decoration:none}#status{position:absolute;top:50%;width:100%;text-align:center;color:#a4c0cd;font-size:12px;pointer-events:none}#status[hidden]{display:none}@media(max-width:550px){.controls{padding:8px}.controls span{width:100%;font-size:10px}.note{font-size:9px}}</style></head><body><div class="controls"><span>Actual saved KiCad board · drag to orbit · scroll or pinch to zoom</span><button id="top">Top</button><button id="bottom">Bottom</button><button id="perspective">Perspective</button><button id="fit">Reset view</button></div><model-viewer id="board" src="aster-joint-interface.glb" alt="The actual ASTER-6 interface PCB, including board, pads, copper and component bodies" camera-controls camera-orbit="35deg 45deg auto" shadow-intensity="0.5" exposure="1" tone-mapping="neutral" environment-image="neu
