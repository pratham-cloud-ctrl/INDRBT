[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-arm"
version = "1.0.0"
description = "Original six-axis industrial arm: parametric CAD and educational digital twin"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "PyYAML>=6,<7", "pillow>=11,<13", "trimesh>=4,<6"]

[project.optional-dependencies]
cad = ["build123d==0.13.0"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "Markdown>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotarm = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
