<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">ASTER-6 conceptual electrical architecture</title>
<desc id="desc">A host commands six joint interfaces and a gripper over RS-485. A joint interface reads encoder and limit signals, and sends low-voltage commands to a separate drive. Independent safety hardware controls actuator energy. One native interface schematic and routed PCB are checked digitally; firmware and physical qualification remain future work.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#287d91"/></marker>
  <marker id="redarrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c25e43"/></marker>
  <style>text{font-family:Arial,Segoe UI,sans-serif}.title{font-size:36px;font-weight:700;fill:#102c40}.sub{font-size:19px;fill:#526b7e}.heading{font-size:23px;font-weight:700;fill:#17354b}.body{font-size:19px;fill:#38576c}.small{font-size:16px;fill:#557080}.label{font-size:16px;fill:#287d91;font-weight:700}.box{fill:#fff;stroke:#c7d6e0;stroke-width:2}.line{fill:none;stroke:#287d91;stroke-width:3;marker-end:url(#arrow)}.safety{fill:none;stroke:#c25e43;stroke-width:3;marker-end:url(#redarrow)}</style>
</defs>
<rect width="1600" height="960" fill="#f4f7f9"/>
<rect x="0" y="0" width="16" height="960" fill="#287d91"/>
<text x="65" y="73" class="title">ASTER-6 / Electrical architecture</text>
<text x="65" y="108" class="sub">One meaningful joint interface • repeated six times, with a seventh gripper node</text>
<rect x="1230" y="48" width="300" height="46" rx="23" fill="#d8ebef"/>
<text x="1380" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#22667a">DIGITAL DESIGN • NO HARDWARE</text>

<rect x="65" y="161" width="1470" height="431" rx="16" fill="#eaf0f4"/>
<text x="91" y="195" class="small" font-weight="700">MOTION, COMMUNICATION AND FEEDBACK</text>
<rect x="96" y="244" width="257" height="165" rx="12" class="box"/>
<text x="120" y="282" class="heading">Motion host</text>
<text x="120" y="321" class="body">Trajectory + IK</text>
<text x="120" y="351" class="body">Supervisory commands</text>
<text x="120" y="380" class="small">Physical bus firmware is future work</text>

<rect x="428" y="244" width="281" height="165" rx="12" class="box"/>
<text x="452" y="282" class="heading">RS-485 multidrop</text>
<text x="452" y="321" class="body">A/B + common ground</text>
<text x="452" y="351" class="body">250 kbit/s target</text>
<text x="452" y="380" class="small">120 Ω only at two endpoints</text>
<path d="M353 327 H422" class="line"/><text x="362" y="307" class="label">Packets</text>

<rect x="785" y="232" width="333" height="241" rx="12" fill="#ffffff" stroke="#287d91" stroke-width="3"/>
<rect x="785" y="232" width="333" height="47" rx="12" fill="#d8ebef"/>
<text x="809" y="263" class="heading">Joint / sensor interface</text>
<text x="809" y="310" class="body">External 3.3 V MCU header</text>
<text x="809" y="342" class="body">LTC2850 + RC input networks</text>
<text x="809" y="374" class="body">5 V → 3.3 V regulated logic</text>
<text x="809" y="416" class="small">44 components • 0 ERC / DRC findings</text>
<text x="809" y="445" class="small">100 × 100 mm PCB • 4 copper layers</text>
<path d="M709 327 H778" class="line"/><text x="719" y="307" class="label">A/B</text>

<rect x="1210" y="232" width="292" height="119" rx="12" class="box"/>
<text x="1234" y="270" class="heading">External motor drive</text>
<text x="1234" y="306" class="body">Power stage + current loop</text>
<text x="1234" y="331" class="small">3.3 V I/O compatibility assumed</text>
<path d="M1118 302 H1203" class="line"/>
<text x="1124" y="279" class="label">STEP / DIR</text>
<text x="1124" y="331" class="label">ENABLE</text>
<rect x="1210" y="390" width="292" height="83" rx="12" class="box"/>
<text x="1234" y="425" class="heading">Joint motor + gearbox</text>
<text x="1234" y="452" class="small">Actuator is outside the interface</text>
<path d="M1356 351 V383" class="line"/>

<rect x="428" y="462" width="281" height="92" rx="12" class="box"/>
<text x="452" y="498" class="heading">Encoder + NC limit</text>
<text x="452" y="529" class="small">A/B/Z feedback + travel monitor</text>
<path d="M709 505 H952 V480" class="line"/>
<text x="745" y="533" class="label">1 kΩ / RC / rail clamps</text>
<text x="98" y="487" class="body">Gripper: node 7</text>
<text x="98" y="517" class="small">Separate actuator drive and</text>
<text x="98" y="541" class="small">symmetric lead-screw mechanism</text>

<rect x="65" y="629" width="669" height="250" rx="16" fill="#e5f0eb"/>
<text x="91" y="668" class="heading">Logic power branch</text>
<rect x="96" y="702" width="248" height="94" rx="12" class="box"/>
<text x="118" y="740" class="body">Regulated 5 V input</text>
<text x="118" y="772" class="small">Fuse + reverse-polarity diode</text>
<rect x="422" y="702" width="279" height="94" rx="12" class="box"/>
<text x="445" y="740" class="body">3.3 V AP2112K supply</text>
<text x="445" y="772" class="small">150 mA total design budget</text>
<path d="M344 750 H414" class="line"/>
<text x="96" y="846" class="small">No motor voltage on this schematic. Thermal/current limits are calculated assumptions.</text>

<rect x="769" y="629" width="766" height="250" rx="16" fill="#f5eae5"/>
<text x="795" y="668" class="heading">Independent actuator safety concept</text>
<rect x="795" y="702" width="201" height="94" rx="12" class="box"/>
<text x="815" y="740" class="body">E-stop contacts</text>
<text x="815" y="772" class="small">Independent safety relay</text>
<rect x="1094" y="702" width="414" height="94" rx="12" class="box"/>
<text x="1118" y="740" class="body">STO / contactor → external drive</text>
<text x="1118" y="772" class="small">24/48 V actuator supply assumed separately</text>
<path d="M996 750 H1086" class="safety"/>
<text x="795" y="831" class="small">Auxiliary NC input reports state only. Firmware is not the actuator shutdown path.</text>
<text x="795" y="856" class="small">Stopping time, brake holding and functional safety have not been verified.</text>

<text x="65" y="926" class="small">VERIFIED DIGITALLY: schematic, routed PCB, ERC / DRC, parity and fabrication exports.   Physical qualification remains open.</text>
</svg>
